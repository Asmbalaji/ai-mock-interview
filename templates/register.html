<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration · Aureye AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b0b0d;
    --bg-1:#141417;
    --panel:rgba(255,255,255,0.04);
    --panel-border:rgba(255,255,255,0.09);
    --gold:#c9a24d;
    --gold-bright:#e6c778;
    --text-hi:#f2ede2;
    --text-lo:#a8a49c;
    --danger:#e0796f;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(201,162,77,0.10), transparent 60%),
      radial-gradient(900px 600px at 100% 110%, rgba(201,162,77,0.06), transparent 55%),
      var(--bg-0);
    font-family:'Inter', sans-serif;
    color:var(--text-hi);
    padding:32px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:18px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:44px 38px 38px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    position:relative;
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    opacity:0.6;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 10px;
    font-weight:500;
  }

  h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:34px;
    margin:0 0 6px;
    color:var(--text-hi);
  }

  .sub{
    font-size:13.5px;
    color:var(--text-lo);
    margin:0 0 30px;
    line-height:1.5;
  }

  form{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .field{
    position:relative;
  }

  .field label{
    display:block;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-lo);
    margin-bottom:7px;
  }

  input{
    width:100%;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:10px;
    padding:13px 14px;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    color:var(--text-hi);
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }

  input::placeholder{ color:#6b675f; }

  input:hover{
    border-color:rgba(255,255,255,0.18);
  }

  input:focus{
    border-color:var(--gold);
    background:rgba(255,255,255,0.05);
    box-shadow:0 0 0 3px rgba(201,162,77,0.15);
  }

  input:invalid:not(:placeholder-shown){
    border-color:var(--danger);
  }

  button{
    margin-top:8px;
    padding:14px 16px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#161409;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    box-shadow:0 8px 20px -6px rgba(201,162,77,0.5);
  }

  button:hover{
    transform:translateY(-1px);
    filter:brightness(1.05);
    box-shadow:0 10px 26px -6px rgba(201,162,77,0.65);
  }

  button:active{
    transform:translateY(0);
  }

  .foot{
    margin-top:22px;
    text-align:center;
    font-size:12.5px;
    color:var(--text-lo);
  }

  .foot a{
    color:var(--gold-bright);
    text-decoration:none;
    font-weight:500;
  }

  .foot a:hover{ text-decoration:underline; }

  @media (max-width:480px){
    .card{ padding:34px 24px 28px; }
    h2{ font-size:28px; }
  }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Aureye AI</p>
  <h2>Student Registration</h2>
  <p class="sub">Create your account to start your AI-powered interview practice.</p>

  <form method="POST">
    <div class="field">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="e.g. Balaji Tharsan" required>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@college.edu" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
    </div>

    <button type="submit">Register</button>
  </form>

  <p class="foot">Already have an account? <a href="#">Sign in</a></p>
</div>

</body>
</html>
