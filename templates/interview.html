<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview</title>
<style>
  :root{
    --bg-1:#dfe7f5;
    --bg-2:#eef1f8;
    --bg-3:#f6e9ef;
    --glass-fill: rgba(255,255,255,0.55);
    --glass-fill-strong: rgba(255,255,255,0.7);
    --glass-border: rgba(255,255,255,0.8);
    --ink-1:#1c1f26;
    --ink-2:#5b6270;
    --accent:#3a6df0;
    --accent-2:#7b5cf0;
    --shadow: 0 8px 32px rgba(31,38,69,0.12);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink-1);
    background:
      radial-gradient(circle at 15% 20%, rgba(123,92,240,0.25), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(58,109,240,0.22), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(255,180,210,0.25), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    overflow-x:hidden;
  }

  /* Ambient floating orbs behind the glass */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    z-index:0;
    animation:drift 16s ease-in-out infinite;
  }
  .orb-a{ width:280px; height:280px; background:#8aa3ff; top:-60px; left:-80px; }
  .orb-b{ width:320px; height:320px; background:#ffb4c6; bottom:-100px; right:-100px; animation-delay:-6s; }
  .orb-c{ width:200px; height:200px; background:#a98cff; top:60%; left:75%; animation-delay:-3s; }

  @keyframes drift{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(20px,-25px) scale(1.08); }
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    border-radius:28px;
    padding:40px 36px;
    backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.6);
  }

  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }

  .eyebrow .label{
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-2);
  }

  h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 6px 0;
  }

  .role-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--glass-fill-strong);
    border:1px solid rgba(255,255,255,0.9);
    border-radius:999px;
    padding:8px 16px;
    font-size:17px;
    font-weight:600;
    color:var(--ink-1);
    margin-bottom:24px;
    box-shadow: 0 2px 8px rgba(31,38,69,0.06);
  }
  .role-pill .dot{
    width:8px; height:8px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    flex-shrink:0;
  }

  /* Progress bar */
  .progress-wrap{
    margin-bottom:28px;
  }
  .progress-text{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--ink-2);
    margin-bottom:8px;
    font-weight:500;
  }
  .progress-track{
    height:8px;
    border-radius:999px;
    background:rgba(255,255,255,0.5);
    border:1px solid rgba(255,255,255,0.7);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    width:{{ (progress / total * 100) if total else 0 }}%;
    transition:width 0.5s ease;
  }

  .question-card{
    background:rgba(255,255,255,0.5);
    border:1px solid rgba(255,255,255,0.8);
    border-radius:20px;
    padding:24px 24px;
    margin-bottom:24px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .question-card h3{
    margin:0;
    font-size:20px;
    line-height:1.5;
    font-weight:600;
    color:var(--ink-1);
  }

  textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
    font-family:inherit;
    font-size:15px;
    line-height:1.6;
    color:var(--ink-1);
    padding:16px 18px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.9);
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(10px);
    box-shadow: inset 0 1px 3px rgba(31,38,69,0.06);
    outline:none;
    transition: box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  textarea::placeholder{ color:#8b91a0; }
  textarea:focus{
    border-color:var(--accent);
    background:rgba(255,255,255,0.75);
    box-shadow: 0 0 0 4px rgba(58,109,240,0.15), inset 0 1px 3px rgba(31,38,69,0.06);
  }

  .actions{
    display:flex;
    justify-content:flex-end;
    margin-top:22px;
  }

  button[type="submit"]{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    color:#fff;
    padding:14px 28px;
    border-radius:999px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 20px rgba(58,109,240,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  button[type="submit"]:hover{
    transform:translateY(-1px);
    box-shadow: 0 10px 28px rgba(58,109,240,0.4), inset 0 1px 0 rgba(255,255,255,0.5);
    filter:brightness(1.04);
  }
  button[type="submit"]:active{
    transform:translateY(0);
    box-shadow: 0 4px 14px rgba(58,109,240,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  button[type="submit"]:focus-visible{
    outline:3px solid rgba(58,109,240,0.5);
    outline-offset:2px;
  }

  @media (max-width:480px){
    .card{ padding:28px 20px; border-radius:22px; }
    .question-card h3{ font-size:18px; }
    button[type="submit"]{ width:100%; justify-content:center; }
   
  }
  
  #micBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    color:#fff;
    padding:14px 28px;
    border-radius:999px;
    background:linear-gradient(135deg,#ff3b30,#ff6b6b);
    box-shadow:0 6px 20px rgba(255,59,48,.35);
    transition:transform .2s ease, box-shadow .2s ease;
    margin-right:12px;
}

#micBtn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(255,59,48,.45);
}

#micBtn:active{
    transform:scale(.98);
}

.actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
}
  
  
</style>
</head>
<body>

  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>

  <div class="card">
    <h1>AI Mock Interview</h1>

    <div class="role-pill">
      <span class="dot"></span>
      {{ role }}
    </div>

    <div class="progress-wrap">
      <div class="progress-text">
        <span>Question {{ progress }} of {{ total }}</span>
        <span>{{ ((progress / total * 100) | round | int) if total else 0 }}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="question-card">
      <h3>{{ question }}</h3>
    </div>
     <form method="POST">

    <textarea
        id="answer"
        name="answer"
        placeholder="Type your answer here..."
        required></textarea>

    <div class="actions">

        <button type="button" id="micBtn">
            🎤 Speak
        </button>

        <button type="submit">
            Next Question →
        </button>

    </div>

</form>

      </div>
<script src="{{ url_for('static', filename='js/speech.js') }}"></script>

</body>
</html>
